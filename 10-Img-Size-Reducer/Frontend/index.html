<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Compress image file size online easily and quickly." />
    <meta name="keywords" content="Image Compressor, Image Size Reducer, JPG Compressor, PNG Compressor" />
    <meta name="author" content="Rohit Singh" />
    <link rel="canonical" href="https://your-live-site-link.com" />
    <link rel="icon" type="image/png" href="./public/favicon.png" />

    <title>Image Size Reducer</title>
    <link rel="stylesheet" href="public/style.css" />
</head>

<body>
    <main>
        <h1>🖼️ Image Size Reducer</h1>

        <form id="uploadForm">
            <label for="imageInput">Select Image:</label>
            <input type="file" id="imageInput" name="image" accept="image/*" required />

            <label for="targetInput">Target Size (KB):</label>
            <input type="number" id="targetInput" name="target_kb" min="10" value="100" required />

            <button type="submit">Compress</button>
        </form>

        <div id="result"></div>
    </main>

    <footer class="bottom-right-footer">

            </a>
